name: CI

on:
    push:
        branches: [ main ]
    pull_request: ~

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    php-cs-fixer:
        name: "Coding Standard"
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@v4
            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    # Must match composer.json's "php": ">=8.3" — the bundle uses PHP 8.3
                    # syntax (typed class constants, anonymous readonly classes) that a
                    # lower PHP CLI's parser can't even lint, let alone fix.
                    php-version: '8.3'
                    tools: php-cs-fixer
            -   name: Check CS
                run: php-cs-fixer fix --dry-run --diff
                continue-on-error: true

    phpstan:
        name: "Static Analysis"
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@v4
            -   name: "Install PHP"
                uses: "shivammathur/setup-php@v2"
                with:
                    php-version: "8.3"
                    ini-values: memory_limit=-1
                    extensions: imagick
            -   name: "Install dependencies"
                run: composer update --no-interaction --no-progress
            -   name: "Run PHPStan"
                run: vendor/bin/phpstan analyse
                continue-on-error: true

    tests:
        name: "Tests (PHP ${{ matrix.php-version }}, Symfony ${{ matrix.symfony }})"
        runs-on: ${{ matrix.operating-system }}
        strategy:
            fail-fast: false
            matrix:
                php-version:
                    - "8.3"
                    - "8.4"
                    - "8.5"
                symfony:
                    - '6.4.*'
                    - '7.4.*'
                    - '8.1.*'
                operating-system:
                    - "ubuntu-latest"
                liip:
                    - "with"
                include:
                    -   php-version: "8.4"
                        symfony: "7.4.*"
                        operating-system: "ubuntu-latest"
                        liip: "without"
                exclude:
                    -   php-version: "8.1"
                        symfony: '8.0.*'
                        operating-system: "ubuntu-latest"
                    -   php-version: "8.2"
                        symfony: '8.0.*'
                        operating-system: "ubuntu-latest"
                    -   php-version: "8.3"
                        symfony: '8.0.*'
                        operating-system: "ubuntu-latest"
        steps:
            -   name: Checkout
                uses: actions/checkout@v4
            -   name: "Install PHP"
                uses: "shivammathur/setup-php@v2"
                with:
                    coverage: "pcov"
                    php-version: "${{ matrix.php-version }}"
                    ini-values: memory_limit=-1
                    extensions: imagick
                    tools: php-coveralls
            -   name: "Install system dependencies"
                # webp (cwebp), libavif-bin (avifenc), jpegoptim, pngquant: the CLI post-processor
                # binaries the Variant pipeline shells out to. Installing all of them means the
                # corresponding PostProcessor tests run for real instead of self-skipping via
                # ExecutableFinder when the binary is missing from PATH.
                run: sudo apt-get update && sudo apt-get install -y webp libavif-bin jpegoptim pngquant
            -   name: "Configure Symfony"
                run: 'composer config extra.symfony.require "${{ matrix.symfony }}"'
            -   name: Get composer cache directory
                id: composer-cache
                run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
            -   name: "Cache dependencies"
                uses: "actions/cache@v3"
                with:
                    path: |
                        ~/.composer/cache
                        vendor
                    key: "php-${{ matrix.php-version }}-symfony-${{ matrix.symfony }}-${{ matrix.liip }}"
                    restore-keys: "php-${{ matrix.php-version }}-symfony-${{ matrix.symfony }}-${{ matrix.liip }}"
            -   name: "Remove Liip bundle"
                run: composer remove liip/imagine-bundle --dev --no-update
                if: matrix.liip == 'without'
            -   name: "Install highest dependencies"
                run: |
                    composer global require php-coveralls/php-coveralls
                    composer update --no-interaction --no-progress
            -   name: Execute tests (Unit and Feature tests) via PHPUnit
                run: vendor/bin/phpunit --coverage-clover build/reports/clover.xml
            -   name: Upload coverage results to Coveralls
                env:
                    COVERALLS_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: |
                    php-coveralls --coverage_clover=build/reports/clover.xml --json_path=build/reports/coveralls-upload.json -v

    tests-without-asset-mapper:
        name: "Tests (without symfony/asset-mapper)"
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@v4
            -   name: "Install PHP"
                uses: "shivammathur/setup-php@v2"
                with:
                    php-version: "8.3"
                    ini-values: memory_limit=-1
                    extensions: imagick
            -   name: Get composer cache directory
                id: composer-cache
                run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
            -   name: "Cache dependencies"
                uses: "actions/cache@v3"
                with:
                    path: |
                        ~/.composer/cache
                        vendor
                    key: "php-8.3-no-asset-mapper"
                    restore-keys: "php-8.3-no-asset-mapper"
            -   name: "Install dependencies"
                run: composer update --no-interaction --no-progress
            -   name: "Remove symfony/asset-mapper"
                # Reproduces the exact failure caught in recipes-contrib's "install this
                # recipe on a bare project" CI check: a project that never installed
                # symfony/asset-mapper at all must still compile and function correctly
                # with an "asset_mapper" resolver configured (it just can't be used).
                run: composer remove symfony/asset-mapper --dev --no-interaction
            -   name: Execute tests (Unit and Feature tests) via PHPUnit
                run: vendor/bin/phpunit

    e2e-tests:
        name: "E2E Test"
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.3'
                    extensions: mbstring, xml, ctype, iconv, gd, imagick
                    tools: composer

            -   name: Get Composer Cache Directory
                id: composer-cache
                run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

            -   name: Cache Composer dependencies
                uses: actions/cache@v4
                with:
                    path: ${{ steps.composer-cache.outputs.dir }}
                    key: ${{ runner.os }}-composer-e2e-${{ hashFiles('**/composer.json') }}
                    restore-keys: |
                        ${{ runner.os }}-composer-e2e-

            -   name: Run E2E test
                # Builds a throwaway symfony/skeleton project, requires this bundle through
                # it via a Composer path repository so the real, published
                # symfony/recipes-contrib Flex recipe is resolved (zero manual config),
                # overlays tests_e2e/basic and asserts the rendered page.
                run: ./tests_e2e/run.sh

            -   name: Upload HTML Response on Failure
                if: failure()
                uses: actions/upload-artifact@v4
                with:
                    name: test-response-html
                    path: tests_e2e/last-failure.html
